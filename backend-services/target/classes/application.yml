server:
  port: 8080

spring:
  application:
    name: backend-service

# Actuator configuration
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
      base-path: /actuator
  endpoint:
    health:
      show-details: always
      show-components: always
  health:
    livenessState:
      enabled: true
    readinessState:
      enabled: true

# Application info
info:
  app:
    name: Backend Service
    description: Core backend service for Telco Self-Care Platform
    version: 1.0.0-SNAPSHOT
