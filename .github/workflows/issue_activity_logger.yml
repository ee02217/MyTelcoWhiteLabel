name: Issue Activity Logger

on:
  push:
    branches: [main, master, develop]
  pull_request:
    types: [opened, closed, synchronize]

permissions:
  contents: read
  issues: write
  pull-requests: read

jobs:
  log-issue-activity:
    runs-on: ubuntu-latest
    steps:
      - name: Extract issue references and log activity
        uses: actions/github-script@v7
        with:
          script: |
            const { repo, owner } = context.repo;

            // github is available as a global in v7
            const issueRefs = new Set();

            // Get commit messages from push
            if (context.eventName === 'push') {
              for (const commit of context.payload.commits) {
                const matches = commit.message.match(/#(\d+)/g);
                if (matches) {
                  matches.forEach(m => issueRefs.add(parseInt(m.replace('#', ''))));
                }
              }
            }

            // Get issue reference from PR title/body
            if (context.eventName === 'pull_request') {
              const pr = context.payload.pull_request;
              const prText = `${pr.title} ${pr.body || ''}`;
              const matches = prText.match(/#(\d+)/g);
              if (matches) {
                matches.forEach(m => issueRefs.add(parseInt(m.replace('#', ''))));
              }
            }

            // Post comments to each referenced issue
            for (const issueNumber of issueRefs) {
              try {
                let commentBody = '';
                
                if (context.eventName === 'push') {
                  const commitId = context.payload.head_commit.id.substring(0, 7);
                  const commitMsg = context.payload.head_commit.message.split('\n')[0];
                  commentBody = `📝 **Commit pushed** to ${context.payload.repository.full_name}\n` +
                    `- Branch: ${context.payload.ref.replace('refs/heads/', '')}\n` +
                    `- Commit: \`${commitId}\`\n` +
                    `- Message: ${commitMsg}\n` +
                    `[View commit](${context.payload.head_commit.url})`;
                } else if (context.eventName === 'pull_request') {
                  const pr = context.payload.pull_request;
                  const action = context.payload.action;
                  
                  if (action === 'opened') {
                    commentBody = `📝 **PR Opened**\n` +
                      `- Branch: ${pr.head.ref}\n` +
                      `- Title: ${pr.title}\n` +
                      `[View PR](${pr.html_url})`;
                  } else if (action === 'synchronize') {
                    commentBody = `📝 **PR Updated**\n` +
                      `- Branch: ${pr.head.ref}\n` +
                      `- New commits pushed\n` +
                      `[View PR](${pr.html_url})`;
                  } else if (action === 'closed' && pr.merged) {
                    commentBody = `✅ **PR Merged**\n` +
                      `- Branch: ${pr.head.ref}\n` +
                      `- Title: ${pr.title}\n` +
                      `[View PR](${pr.html_url})`;
                  }
                }
                
                if (commentBody) {
                  await github.rest.issues.createComment({
                    owner,
                    repo,
                    issue_number: issueNumber,
                    body: commentBody
                  });
                  console.log(`Posted comment to issue #${issueNumber}`);
                }
              } catch (error) {
                console.error(`Failed to comment on issue #${issueNumber}:`, error.message);
              }
            }

            if (issueRefs.size === 0) {
              console.log('No issue references found in commit/PR');
            } else {
              console.log(`Processed ${issueRefs.size} issue reference(s)`);
            }
