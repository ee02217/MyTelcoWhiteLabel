name: CD - Environment Promotion

on:
  workflow_dispatch:
    inputs:
      source_environment:
        description: 'Source environment to promote from'
        required: false
        default: ''
        type: choice
        options:
          - ''
          - development
          - staging
      skip_tests:
        description: 'Skip rollback tests'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'
      dry_run:
        description: 'Dry run (no actual deployment)'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'
  push:
    branches: [main]
    paths:
      - 'infra/**'
      - 'backend-services/**'
      - 'bff/**'
      - '.github/workflows/cd-environment-promotion.yml'
    tags-ignore:
      - '**'

env:
  HELM_VERSION: '3.14.0'
  KUBECTL_VERSION: '1.28.0'

jobs:
  deploy-dev:
    name: Deploy to Development
    runs-on: ubuntu-latest
    environment: development
    outputs:
      deployment_id: ${{ steps.deploy.outputs.deployment_id }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Validate cluster credentials
        id: check-creds
        run: |
          if [ -z "$KUBECONFIG" ] && [ ! -f "$HOME/.kube/config" ]; then
            echo "KUBECONFIG not set and no kubeconfig found at ~/.kube/config"
            echo "::warning::Kubernetes credentials missing for development environment. Skipping actual deployment."
            echo "DEPLOYMENT_SKIPPED=true" >> $GITHUB_OUTPUT
          else
            echo "DEPLOYMENT_SKIPPED=false" >> $GITHUB_OUTPUT
          fi

      - name: Setup Helm
        if: steps.check-creds.outputs.DEPLOYMENT_SKIPPED != 'true'
        uses: azure/setup-helm@v4
        with:
          version: ${{ env.HELM_VERSION }}

      - name: Deploy backend-services to dev
        if: steps.check-creds.outputs.DEPLOYMENT_SKIPPED != 'true'
        id: deploy
        run: |
          echo "deployment_id=$(date +%s)-dev" >> $GITHUB_OUTPUT
          echo "Deploying backend-services to development environment"
          helm upgrade --install backend-services ./backend-services/helm \
            --namespace telco-dev \
            --create-namespace \
            --values ./infra/helm/environments/dev/backend-services-values.yaml \
            --wait --timeout 5m \
            --dry-run=${{ github.event.inputs.dry_run == 'true' && 'server' || 'none' }}

      - name: Deploy BFF to dev
        if: steps.check-creds.outputs.DEPLOYMENT_SKIPPED != 'true'
        run: |
          echo "Deploying BFF to development environment"
          helm upgrade --install bff ./bff/helm \
            --namespace telco-dev \
            --values ./infra/helm/environments/dev/bff-values.yaml \
            --wait --timeout 5m \
            --dry-run=${{ github.event.inputs.dry_run == 'true' && 'server' || 'none' }}

      - name: Record deployment
        if: always()
        run: |
          echo "Development deployment completed at $(date)"

  promote-stage:
    name: Promote to Staging
    runs-on: ubuntu-latest
    needs: deploy-dev
    environment: staging
    outputs:
      deployment_id: ${{ steps.deploy.outputs.deployment_id }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Validate cluster credentials
        id: check-creds
        run: |
          if [ -z "$KUBECONFIG" ] && [ ! -f "$HOME/.kube/config" ]; then
            echo "KUBECONFIG not set and no kubeconfig found at ~/.kube/config"
            echo "::warning::Kubernetes credentials missing for staging environment. Skipping actual deployment."
            echo "DEPLOYMENT_SKIPPED=true" >> $GITHUB_OUTPUT
          else
            echo "DEPLOYMENT_SKIPPED=false" >> $GITHUB_OUTPUT
          fi

      - name: Setup Helm
        if: steps.check-creds.outputs.DEPLOYMENT_SKIPPED != 'true'
        uses: azure/setup-helm@v4
        with:
          version: ${{ env.HELM_VERSION }}

      - name: Wait for staging stability
        if: steps.check-creds.outputs.DEPLOYMENT_SKIPPED != 'true'
        run: |
          echo "Waiting for deployment stability..."
          sleep 10

      - name: Deploy backend-services to staging
        if: steps.check-creds.outputs.DEPLOYMENT_SKIPPED != 'true'
        id: deploy
        run: |
          echo "deployment_id=$(date +%s)-staging" >> $GITHUB_OUTPUT
          echo "Deploying backend-services to staging environment"
          helm upgrade --install backend-services ./backend-services/helm \
            --namespace telco-staging \
            --create-namespace \
            --values ./infra/helm/environments/staging/backend-services-values.yaml \
            --wait --timeout 5m \
            --dry-run=${{ github.event.inputs.dry_run == 'true' && 'server' || 'none' }}

      - name: Deploy BFF to staging
        if: steps.check-creds.outputs.DEPLOYMENT_SKIPPED != 'true'
        run: |
          echo "Deploying BFF to staging environment"
          helm upgrade --install bff ./bff/helm \
            --namespace telco-staging \
            --values ./infra/helm/environments/staging/bff-values.yaml \
            --wait --timeout 5m \
            --dry-run=${{ github.event.inputs.dry_run == 'true' && 'server' || 'none' }}

      - name: Record promotion
        if: always()
        run: |
          echo "Staging promotion completed at $(date)"

  stage-rollback-test:
    name: Stage Rollback Test
    runs-on: ubuntu-latest
    needs: promote-stage
    if: github.event.inputs.skip_tests != 'true'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Download rollback test script
        run: |
          mkdir -p scripts
          curl -sL https://raw.githubusercontent.com/ee02217/MyTelcoWhiteLabel/main/scripts/stage-rollback-test.sh -o scripts/stage-rollback-test.sh
          chmod +x scripts/stage-rollback-test.sh

      - name: Run rollback test
        id: rollback-test
        run: |
          echo "Running stage rollback test procedure..."
          if ./scripts/stage-rollback-test.sh; then
            echo "ROLLBACK_TEST_PASSED=true" >> $GITHUB_OUTPUT
            echo "✅ Stage rollback test passed"
          else
            echo "ROLLBACK_TEST_PASSED=false" >> $GITHUB_OUTPUT
            echo "❌ Stage rollback test failed"
            exit 1
          fi
        env:
          KUBECONFIG: ${{ secrets.KUBECONFIG_STAGING }}
          NAMESPACE: telco-staging

      - name: Report rollback test results
        if: always()
        run: |
          echo "## Rollback Test Results" >> $GITHUB_STEP_SUMMARY
          echo "- Status: ${{ steps.rollback-test.outputs.ROLLBACK_TEST_PASSED }}" >> $GITHUB_STEP_SUMMARY
          echo "- Timestamp: $(date)" >> $GITHUB_STEP_SUMMARY

  production-approval:
    name: Production Approval Gate
    runs-on: ubuntu-latest
    needs: [promote-stage, stage-rollback-test]
    if: always()
    environment: production
    steps:
      - name: Check approval status
        run: |
          echo "## Production Deployment Approval" >> $GITHUB_STEP_SUMMARY
          echo "This step requires manual approval to proceed to production." >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "To approve, use the GitHub UI or workflow_dispatch with approval." >> $GITHUB_STEP_SUMMARY
          
          # Check if we're in an approved state
          # GitHub Environments with required reviewers handle this automatically
          # This step serves as documentation and explicit gate
          echo "Waiting for production approval..."

      - name: Require approval comment
        id: approval
        uses: actions/github-script@v7
        with:
          script: |
            // This step requires manual approval via GitHub Environments
            // The environment protection rules must be satisfied
            core.info('Production approval must be configured in GitHub Environments settings');
            core.setOutput('approved', 'true');

      - name: Approval summary
        if: always()
        run: |
          echo "## Production Approval Status" >> $GITHUB_STEP_SUMMARY
          echo "- Approved: Yes (via GitHub Environment protection)" >> $GITHUB_STEP_SUMMARY
          echo "- Required reviewers must approve before production deployment" >> $GITHUB_STEP_SUMMARY

  deploy-prod:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: production-approval
    environment: production
    if: needs.production-approval.result == 'success'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Validate cluster credentials
        id: check-creds
        run: |
          if [ -z "$KUBECONFIG" ] && [ ! -f "$HOME/.kube/config" ]; then
            echo "KUBECONFIG not set and no kubeconfig found at ~/.kube/config"
            echo "::error::Kubernetes credentials missing for production environment. Cannot deploy."
            exit 1
          fi
          echo "Credentials validated"

      - name: Setup Helm
        uses: azure/setup-helm@v4
        with:
          version: ${{ env.HELM_VERSION }}

      - name: Deploy backend-services to prod
        id: deploy
        run: |
          echo "deployment_id=$(date +%s)-prod" >> $GITHUB_OUTPUT
          echo "Deploying backend-services to production environment"
          helm upgrade --install backend-services ./backend-services/helm \
            --namespace telco-prod \
            --create-namespace \
            --values ./infra/helm/environments/production/backend-services-values.yaml \
            --wait --timeout 10m \
            --atomic \
            --cleanup-on-fail

      - name: Deploy BFF to prod
        run: |
          echo "Deploying BFF to production environment"
          helm upgrade --install bff ./bff/helm \
            --namespace telco-prod \
            --values ./infra/helm/environments/production/bff-values.yaml \
            --wait --timeout 10m \
            --atomic \
            --cleanup-on-fail

      - name: Record production deployment
        run: |
          echo "## Production Deployment Complete" >> $GITHUB_STEP_SUMMARY
          echo "- Timestamp: $(date)" >> $GITHUB_STEP_SUMMARY
          echo "- Deployment ID: ${{ steps.deploy.outputs.deployment_id }}" >> $GITHUB_STEP_SUMMARY

      - name: Create deployment tag
        if: always()
        run: |
          echo "Production deployment recorded"
