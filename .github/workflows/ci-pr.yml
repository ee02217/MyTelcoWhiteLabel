name: CI - Pull Request

on:
  pull_request:
    branches: [main]
    paths-ignore:
      - '*.md'
      - 'docs/**'
      - '.gitignore'
      - 'LICENSE'

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  JAVA_VERSION: '17'
  NODE_VERSION: '20'

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run lint on changed modules
        run: npm run lint:changed

  test-node:
    name: Test - Node.js Modules
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run tests on changed modules
        run: npm run test:changed

  test-java-backend:
    name: Test - Backend Services
    runs-on: ubuntu-latest
    if: |
      contains(github.event.pull_request.changed_files, 'backend-services/') ||
      contains(github.event.pull_request.changed_files, 'pom.xml')
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'
          cache: 'maven'

      - name: Build and test backend-services
        working-directory: backend-services
        run: mvn clean verify -DskipTests=false

  test-java-bff:
    name: Test - BFF
    runs-on: ubuntu-latest
    if: |
      contains(github.event.pull_request.changed_files, 'bff/') ||
      contains(github.event.pull_request.changed_files, 'pom.xml')
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'
          cache: 'maven'

      - name: Build and test bff
        working-directory: bff
        run: mvn clean verify -DskipTests=false

  branding-validate:
    name: Validate Branding Configs
    runs-on: ubuntu-latest
    if: |
      github.event_name == 'pull_request' && (
        contains(github.event.pull_request.changed_files, 'platform-config/operators/') ||
        contains(github.event.pull_request.changed_files, 'scripts/validate-branding-config.mjs')
      )
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Validate branding configurations
        run: node scripts/validate-branding-config.mjs

  sca-scan:
    name: SCA Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run npm audit
        run: npm audit --audit-level=moderate

      - name: Run OWASP Dependency Check (Java - backend-services)
        if: |
          contains(github.event.pull_request.changed_files, 'backend-services/') ||
          contains(github.event.pull_request.changed_files, 'pom.xml')
        working-directory: backend-services
        run: |
          mvn org.owasp:dependency-check-maven:check \
            -DfailBuildOnCVSS=7 \
            -DassemblyAnalyzerEnabled=true \
            -DenableExperimental=true

      - name: Run OWASP Dependency Check (Java - bff)
        if: |
          contains(github.event.pull_request.changed_files, 'bff/') ||
          contains(github.event.pull_request.changed_files, 'pom.xml')
        working-directory: bff
        run: |
          mvn org.owasp:dependency-check-maven:check \
            -DfailBuildOnCVSS=7 \
            -DassemblyAnalyzerEnabled=true \
            -DenableExperimental=true

  build-docker:
    name: Build Docker Images
    runs-on: ubuntu-latest
    needs: [lint, test-node, test-java-backend, test-java-bff, sca-scan]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build backend-services image
        if: |
          contains(github.event.pull_request.changed_files, 'backend-services/') ||
          contains(github.event.pull_request.changed_files, 'Dockerfile')
        working-directory: backend-services
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          tags: mytelco/backend-services:pr-${{ github.event.pull_request.number }}
          load: true

      - name: Build BFF image
        if: |
          contains(github.event.pull_request.changed_files, 'bff/') ||
          contains(github.event.pull_request.changed_files, 'Dockerfile')
        working-directory: bff
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          tags: mytelco/bff:pr-${{ github.event.pull_request.number }}
          load: true
