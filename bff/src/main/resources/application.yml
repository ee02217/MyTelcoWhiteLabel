server:
  port: 8081

spring:
  application:
    name: bff-service
  webflux:
    # WebFlux configuration for reactive programming
    base-path: /api

# Actuator configuration
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
      base-path: /actuator
  endpoint:
    health:
      show-details: always
      show-components: always
  health:
    livenessState:
      enabled: true
    readinessState:
      enabled: true

# Application info
info:
  app:
    name: BFF Service
    description: Backend-for-Frontend service for Telco Self-Care Platform
    version: 1.0.0-SNAPSHOT

# Backend service URLs (configure for your environment)
bff:
  backend-services:
    base-url: http://localhost:8080
    timeout: 5000
