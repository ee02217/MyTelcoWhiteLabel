name: mytelco-local

services:
  postgres:
    image: postgres:16-alpine
    container_name: mytelco-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-mytelco}
      POSTGRES_USER: ${POSTGRES_USER:-mytelco}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mytelco}
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - postgres-local-data:/var/lib/postgresql/data
      - ./postgres/init/001-baseline.sql:/docker-entrypoint-initdb.d/001-baseline.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-mytelco} -d ${POSTGRES_DB:-mytelco}']
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - mytelco-network

  keycloak:
    image: quay.io/keycloak/keycloak:24.0.0
    container_name: mytelco-keycloak
    command: ['start-dev', '--import-realm']
    environment:
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN:-admin}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}
      KC_HEALTH_ENABLED: 'true'
      KC_METRICS_ENABLED: 'true'
      KC_DB: dev-file
    ports:
      - '${KEYCLOAK_PORT:-8080}:8080'
    volumes:
      - ../keycloak/realm-export/telco-dev-realm.json:/opt/keycloak/data/import/telco-dev-realm.json:ro
    healthcheck:
      test:
        [
          'CMD-SHELL',
          "exec 3<>/dev/tcp/127.0.0.1/8080 && echo -e 'GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && cat <&3 | grep '200' >/dev/null",
        ]
      interval: 20s
      timeout: 10s
      retries: 8
      start_period: 60s
    networks:
      - mytelco-network

  kong:
    image: kong:3.4
    container_name: mytelco-kong
    environment:
      KONG_DATABASE: 'off'
      KONG_DECLARATIVE_CONFIG: /usr/local/kong/declarative/kong.yml
      KONG_DNS_ORDER: LAST,A,SRV
      KONG_LOG_LEVEL: info
      KONG_PROXY_ACCESS_LOG: /dev/stdout
      KONG_ADMIN_ACCESS_LOG: /dev/stdout
      KONG_PROXY_ERROR_LOG: /dev/stderr
      KONG_ADMIN_ERROR_LOG: /dev/stderr
      KONG_ADMIN_LISTEN: 0.0.0.0:8001, 0.0.0.0:8444 ssl
      KONG_STATUS_LISTEN: 0.0.0.0:8100
      KONG_PLUGINS: bundled,prometheus
    ports:
      - '${KONG_PROXY_PORT:-8000}:8000'
      - '${KONG_ADMIN_PORT:-8001}:8001'
      - '${KONG_PROXY_TLS_PORT:-8443}:8443'
      - '${KONG_ADMIN_TLS_PORT:-8444}:8444'
      - '${KONG_STATUS_PORT:-8100}:8100'
    volumes:
      - ../kong/kong.local.yml:/usr/local/kong/declarative/kong.yml:ro
    healthcheck:
      test: ['CMD', 'kong', 'health']
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    networks:
      - mytelco-network

  kafka:
    image: apache/kafka:3.8.0
    container_name: mytelco-kafka
    profiles: ['kafka']
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'true'
      CLUSTER_ID: ${KAFKA_KRAFT_CLUSTER_ID:-MkU3OEVBNTcwNTJENDM2Qk}
    ports:
      - '${KAFKA_PORT:-9092}:9092'
    volumes:
      - kafka-local-data:/var/lib/kafka/data
    healthcheck:
      test:
        ['CMD-SHELL', 'kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1']
      interval: 20s
      timeout: 10s
      retries: 12
      start_period: 30s
    networks:
      - mytelco-network

  customer-bff:
    build:
      context: ../../bff/customer-bff
    container_name: mytelco-customer-bff
    environment:
      SERVER_PORT: 8081
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-local}
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI: ${INTERNAL_OIDC_ISSUER:-http://keycloak:8080/realms/mytelco-white-label}
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK_SET_URI: ${INTERNAL_OIDC_JWKS_URI:-http://keycloak:8080/realms/mytelco-white-label/protocol/openid-connect/certs}
      MANAGEMENT_TRACING_SAMPLING_PROBABILITY: ${MANAGEMENT_TRACING_SAMPLING_PROBABILITY:-1.0}
      MANAGEMENT_OTLP_TRACING_ENDPOINT: ${MANAGEMENT_OTLP_TRACING_ENDPOINT:-http://otel-collector:4318/v1/traces}
      MYTELCO_EVENTS_DISPATCH_MODE: ${MYTELCO_EVENTS_DISPATCH_MODE:-stub}
      SPRING_KAFKA_BOOTSTRAP_SERVERS: ${SPRING_KAFKA_BOOTSTRAP_SERVERS:-kafka:9092}
      SPRING_KAFKA_PRODUCER_MAX_BLOCK_MS: ${SPRING_KAFKA_PRODUCER_MAX_BLOCK_MS:-3000}
      SPRING_KAFKA_PRODUCER_REQUEST_TIMEOUT_MS: ${SPRING_KAFKA_PRODUCER_REQUEST_TIMEOUT_MS:-2000}
      SPRING_KAFKA_PRODUCER_DELIVERY_TIMEOUT_MS: ${SPRING_KAFKA_PRODUCER_DELIVERY_TIMEOUT_MS:-5000}
      CASE_BFF_BASE_URL: ${CASE_BFF_BASE_URL:-http://case-bff:8083}
      # Cookie configuration - Lax/non-secure for local HTTP development
      # (SameSite=None+Secure was removed: the portal now uses relative paths via nginx
      #  so cookies are same-origin and do not need cross-site/Secure semantics over HTTP)
      APP_AUTH_COOKIE_SAMESITE: ${APP_AUTH_COOKIE_SAMESITE:-Lax}
      APP_AUTH_COOKIE_SECURE: ${APP_AUTH_COOKIE_SECURE:-false}
    volumes:
      - ../../platform-config:/app/platform-config:ro
    ports:
      - '${CUSTOMER_BFF_PORT:-8081}:8081'
    depends_on:
      postgres:
        condition: service_healthy
      keycloak:
        condition: service_healthy
      kong:
        condition: service_healthy
    healthcheck:
      test: ['CMD-SHELL', 'wget -q --spider http://localhost:8081/actuator/health || exit 1']
      interval: 20s
      timeout: 5s
      retries: 8
      start_period: 45s
    networks:
      - mytelco-network

  admin-bff:
    build:
      context: ../../bff/admin-bff
    container_name: mytelco-admin-bff
    environment:
      SERVER_PORT: 8082
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-local}
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI: ${INTERNAL_OIDC_ISSUER:-http://keycloak:8080/realms/mytelco-white-label}
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK_SET_URI: ${INTERNAL_OIDC_JWKS_URI:-http://keycloak:8080/realms/mytelco-white-label/protocol/openid-connect/certs}
      MANAGEMENT_TRACING_SAMPLING_PROBABILITY: ${MANAGEMENT_TRACING_SAMPLING_PROBABILITY:-1.0}
      MANAGEMENT_OTLP_TRACING_ENDPOINT: ${MANAGEMENT_OTLP_TRACING_ENDPOINT:-http://otel-collector:4318/v1/traces}
    volumes:
      - ../../platform-config:/app/platform-config:ro
    ports:
      - '${ADMIN_BFF_PORT:-8082}:8082'
    depends_on:
      postgres:
        condition: service_healthy
      keycloak:
        condition: service_healthy
      kong:
        condition: service_healthy
    healthcheck:
      test: ['CMD-SHELL', 'wget -q --spider http://localhost:8082/actuator/health || exit 1']
      interval: 20s
      timeout: 5s
      retries: 8
      start_period: 45s
    networks:
      - mytelco-network

  case-bff:
    build:
      context: ../../bff/case-bff
    container_name: mytelco-case-bff
    environment:
      SERVER_PORT: 8083
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-local}
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI: ${INTERNAL_OIDC_ISSUER:-http://keycloak:8080/realms/mytelco-white-label}
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK_SET_URI: ${INTERNAL_OIDC_JWKS_URI:-http://keycloak:8080/realms/mytelco-white-label/protocol/openid-connect/certs}
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${POSTGRES_DB:-mytelco}
      DB_USER: ${POSTGRES_USER:-mytelco}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-mytelco}
    ports:
      - '${CASE_BFF_PORT:-8083}:8083'
    depends_on:
      postgres:
        condition: service_healthy
      keycloak:
        condition: service_healthy
      kong:
        condition: service_healthy
    healthcheck:
      test: ['CMD-SHELL', 'wget -q --spider http://localhost:8083/actuator/health || exit 1']
      interval: 20s
      timeout: 5s
      retries: 8
      start_period: 45s
    networks:
      - mytelco-network

  web-portal:
    build:
      context: ../..
      dockerfile: infra/docker/web-portal.Dockerfile
      args:
        VITE_OIDC_ISSUER: ${WEB_OIDC_ISSUER:-http://localhost:8080/realms/mytelco-white-label}
        VITE_OIDC_CLIENT_ID: ${WEB_OIDC_CLIENT_ID:-web-portal}
        VITE_OIDC_REDIRECT_URI: ${WEB_OIDC_REDIRECT_URI_DOCKER:-http://localhost:3000/callback}
        VITE_OIDC_POST_LOGOUT_REDIRECT_URI: ${WEB_OIDC_POST_LOGOUT_REDIRECT_URI_DOCKER:-http://localhost:3000}
        VITE_OIDC_SCOPES: ${WEB_OIDC_SCOPES:-"openid roles"}
    container_name: mytelco-web-portal
    environment:
      API_UPSTREAM: ${WEB_PORTAL_API_UPSTREAM:-http://kong:8000}
    ports:
      - '${WEB_PORTAL_PORT:-3000}:80'
    depends_on:
      customer-bff:
        condition: service_started
      kong:
        condition: service_healthy
    healthcheck:
      test: ['CMD-SHELL', 'wget -q --spider http://127.0.0.1/ || exit 1']
      interval: 20s
      timeout: 5s
      retries: 8
      start_period: 15s
    networks:
      - mytelco-network

  admin-portal:
    build:
      context: ../..
      dockerfile: infra/docker/admin-portal.Dockerfile
      args:
        VITE_OIDC_ISSUER: ${ADMIN_OIDC_ISSUER:-http://localhost:8080/realms/mytelco-white-label}
        VITE_OIDC_CLIENT_ID: ${ADMIN_OIDC_CLIENT_ID:-admin-portal}
        VITE_OIDC_REDIRECT_URI: ${ADMIN_OIDC_REDIRECT_URI_DOCKER:-http://localhost:3001/callback}
        VITE_OIDC_POST_LOGOUT_REDIRECT_URI: ${ADMIN_OIDC_POST_LOGOUT_REDIRECT_URI_DOCKER:-http://localhost:3001}
        VITE_OIDC_SCOPES: ${ADMIN_OIDC_SCOPES:-"openid roles"}
    container_name: mytelco-admin-portal
    environment:
      API_UPSTREAM: ${ADMIN_PORTAL_API_UPSTREAM:-http://kong:8000}
    ports:
      - '${ADMIN_PORTAL_PORT:-3001}:80'
    depends_on:
      admin-bff:
        condition: service_started
      kong:
        condition: service_healthy
    healthcheck:
      test: ['CMD-SHELL', 'wget -q --spider http://127.0.0.1/ || exit 1']
      interval: 20s
      timeout: 5s
      retries: 8
      start_period: 15s
    networks:
      - mytelco-network

  prometheus:
    image: prom/prometheus:latest
    container_name: mytelco-prometheus
    depends_on:
      keycloak:
        condition: service_healthy
      kong:
        condition: service_healthy
      customer-bff:
        condition: service_started
      admin-bff:
        condition: service_started
    ports:
      - '${PROMETHEUS_PORT:-9090}:9090'
    volumes:
      - ../observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
    networks:
      - mytelco-network

  grafana:
    image: grafana/grafana:10.0.8
    container_name: mytelco-grafana
    depends_on:
      prometheus:
        condition: service_started
    ports:
      - '${GRAFANA_PORT:-3005}:3000'
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-grafana}
      GF_AUTH_ANONYMOUS_ENABLED: 'false'
      GF_USERS_ALLOW_SIGN_UP: 'false'
    volumes:
      - ../observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ../observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
    networks:
      - mytelco-network

  opensearch:
    image: opensearchproject/opensearch:2.8.0
    container_name: mytelco-opensearch
    environment:
      cluster.name: mytelco-observability
      node.name: mytelco-opensearch
      discovery.type: single-node
      bootstrap.memory_lock: 'false'
      OPENSEARCH_JAVA_OPTS: '-Xms512m -Xmx512m'
      plugins.security.disabled: 'true'
    ulimits:
      memlock:
        soft: -1
        hard: -1
    ports:
      - '${OPENSEARCH_PORT:-9200}:9200'
      - '9600:9600'
    volumes:
      - opensearch-local-data:/usr/share/opensearch/data
    networks:
      - mytelco-network

  jaeger:
    image: jaegertracing/all-in-one:1.51
    container_name: mytelco-jaeger
    ports:
      - '${JAEGER_UI_PORT:-16686}:16686'
      - '14268:14268'
      - '14250:14250'
      - '14269:14269'
    environment:
      COLLECTOR_ZIPKIN_HTTP_PORT: 9411
      COLLECTOR_OTLP_ENABLED: 'true'
    networks:
      - mytelco-network

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.82.0
    container_name: mytelco-otel-collector
    command:
      - '--config=/etc/otel-collector-config.yml'
    depends_on:
      jaeger:
        condition: service_started
    ports:
      - '4317:4317'
      - '4318:4318'
      - '8888:8888'
    volumes:
      - ../observability/otel-collector/config.yml:/etc/otel-collector-config.yml:ro
    networks:
      - mytelco-network

  fluent-bit:
    image: fluent/fluent-bit:2.0
    container_name: mytelco-fluent-bit
    depends_on:
      opensearch:
        condition: service_started
    volumes:
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - ../observability/fluent-bit/fluent-bit.conf:/fluent-bit/etc/fluent-bit.conf:ro
      - ../observability/fluent-bit/parsers.conf:/fluent-bit/etc/parsers.conf:ro
    networks:
      - mytelco-network

networks:
  mytelco-network:
    driver: bridge

volumes:
  opensearch-local-data:
  postgres-local-data:
  kafka-local-data:
