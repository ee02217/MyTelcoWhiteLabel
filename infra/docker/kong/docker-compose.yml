  #     interval: 10s
  #     timeout: 5s
  #     retries: 3

  # Optional: Admin BFF service for testing
  #
  # admin-bff:
  #   image: nginx:alpine
  #   container_name: mytelco-admin-bff
  #   ports:
  #     - "8081:80"
  #   networks:
  #     - mytelco-network
  #   volumes:
  #     - ./admin-bff-mock.conf:/etc/nginx/conf.d/default.conf:ro
  #   healthcheck:
  #     test: ["CMD", "wget", "-q", "--spider", "http://localhost/health"]
  #     interval: 10s
  #     timeout: 5s
  #     retries: 3

