# Kong Gateway Local Development Docker Compose
# Version: 1.0.0
#
# This compose file provides a local Kong gateway for development and testing.
# It uses Kong in db-less mode with the declarative configuration.
#
# Usage:
#   docker compose up -d
#   docker compose logs -f kong
#
# Endpoints:
#   - Kong Gateway:   http://localhost:8000
#   - Kong Admin API: http://localhost:8001
#   - Kong Manager:   http://localhost:8002 (requires Kong Enterprise or disabled auth)
#
# NOTE: This configuration uses Kong in db-less mode.
# For production with database, use Postgres backend.

services:
  kong:
    image: kong:3.4
    container_name: mytelco-kong
    restart: unless-stopped
    ports:
      # Kong proxy (gateway entry point)
      - '8000:8000'
      # Kong proxy HTTPS
      - '8443:8443'
      # Kong Admin API
      - '8001:8001'
      # Kong Admin HTTPS
      - '8444:8444'
      # Kong Manager (web UI - disabled in dev mode)
      # - "8002:8000"
    environment:
      # Database mode: db-less
      KONG_DATABASE: 'off'

      # Declarative configuration
      KONG_DECLARATIVE_CONFIG: /usr/local/kong/declarative/kong.yml

      # DNS resolver
      KONG_DNS_ORDER: LAST,A,SRV

      # Performance tuning
      KONG_NGINX_PROXY_PROXY_BUFFER_SIZE: 160k
      KONG_NGINX_PROXY_PROXY_BUFFERS: 64 160k

      # Logging
      KONG_LOG_LEVEL: info
      KONG_PROXY_ACCESS_LOG: /dev/stdout
      KONG_ADMIN_ACCESS_LOG: /dev/stdout
      KONG_PROXY_ERROR_LOG: /dev/stderr
      KONG_ADMIN_ERROR_LOG: /dev/stderr

      # CORS preflight caching
      KONG_NGINX_HTTP_LUA_MAX_TIMES: 1000

      # Development-friendly settings
      KONG_PLUGINS: request-transformer,response-transformer,jwt,rate-limiting,cors
    volumes:
      # Mount declarative config
      - ../../kong/kong.local.yml:/usr/local/kong/declarative/kong.yml:ro
    networks:
      - mytelco-network
    healthcheck:
      test: ['CMD', 'kong', 'health']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    # Uncomment for Redis-backed rate limiting
    # redis:
    #   image: redis:7-alpine
    #   container_name: mytelco-redis
    #   ports:
    #     - "6379:6379"
    #   networks:
    #     - mytelco-network
    #   volumes:
    #     - redis-data:/data
    # Environment for Redis rate limiting:
    #   KONG_PLUGINS: request-transformer,response-transformer,jwt,rate-limiting,cors
    #   KONG_RATE_LIMITING_REDIS_HOST: redis

  # Optional: BFF service for testing
  # Uncomment and configure for end-to-end testing
  #
