global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['prometheus:9090']

  - job_name: 'customer-bff'
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ['customer-bff:8081']

  - job_name: 'admin-bff'
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ['admin-bff:8082']

  - job_name: 'keycloak'
    metrics_path: /metrics
    static_configs:
      - targets: ['keycloak:8080']

  - job_name: 'kong'
    metrics_path: /metrics
    static_configs:
      - targets: ['mytelco-kong:8100']

  - job_name: 'otel-collector'
    metrics_path: /metrics
    static_configs:
      - targets: ['mytelco-otel-collector:8888']
