# BFF Service - Development Environment
# Deploys with development configuration and debug settings

namespace: telco-dev

replicaCount: 1

image:
  repository: mytelco/bff
  tag: latest
  pullPolicy: IfNotPresent

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  annotations: {}
  name: ""

podAnnotations:
  prometheus.io/scrape: "true"
  prometheus.io/port: "8080"

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  fsGroup: 1000

service:
  type: ClusterIP
  port: 8080
  targetPort: 8080

ingress:
  enabled: true
  className: nginx
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
    cert-manager.io/cluster-issuer: letsencrypt-prod
  hosts:
    - host: dev.mytelco.local
      paths:
        - path: /
          pathType: Prefix
  tls:
    - secretName: bff-dev-tls
      hosts:
        - dev.mytelco.local

resources:
  limits:
    cpu: 500m
    memory: 512Mi
  requests:
    cpu: 100m
    memory: 256Mi

autoscaling:
  enabled: false

nodeSelector: {}

tolerations: []

affinity: {}

# Environment-specific configuration
env:
  - name: SPRING_PROFILES_ACTIVE
    value: "dev"
  - name: BACKEND_SERVICE_URL
    value: "http://backend-services:8080"
  - name: LOG_LEVEL
    value: "DEBUG"
  - name: SESSION_TIMEOUT
    value: "1800"

config:
  backend:
    timeout: 30
    retry_attempts: 3
  cache:
    enabled: true
    ttl: 300

# Development-specific overrides
livenessProbe:
  httpGet:
    path: /actuator/health/liveness
    port: 8080
  initialDelaySeconds: 30
  periodSeconds: 10

readinessProbe:
  httpGet:
    path: /actuator/health/readiness
    port: 8080
  initialDelaySeconds: 10
  periodSeconds: 5
