apiVersion: apps/v1
kind: Deployment
metadata:
  name: bff
  labels:
    app: bff
    tier: backend
    version: v1
spec:
  replicas: 2
  selector:
    matchLabels:
      app: bff
  template:
    metadata:
      labels:
        app: bff
        tier: backend
        version: v1
    spec:
      containers:
        - name: bff
          image: ee02217/mytelco-bff:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8081
              name: http
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8081
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8081
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              memory: "384Mi"
              cpu: "200m"
            limits:
              memory: "768Mi"
              cpu: "400m"
          env:
            - name: SPRING_PROFILES_ACTIVE
              value: "kubernetes"
            - name: BFF_BACKEND-SERVICES_BASE-URL
              value: "http://backend-services:8080"
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            fsGroup: 1000
